name: Mandatory Core CI

on:
  push:
  pull_request:

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: python3 -I tools/test_check_contract_sizes.py
      - run: python3 -I tools/test_check_slither_baseline.py
      - run: python3 -I tools/generate_full_math_vectors.py --check
      - run: python3 -I tools/generate_hash_vectors.py --check
      - run: python3 -I tools/check_q128_boundary_bound.py --check
      - run: forge fmt --check
      - name: Build production contracts without warnings
        run: forge build --skip test --deny warnings
      - name: Build and enforce Mandatory Core bytecode limits
        run: |
          set -o pipefail
          forge build --sizes | tee /tmp/forge-sizes.txt
          python3 -I tools/check_contract_sizes.py /tmp/forge-sizes.txt
      - run: forge test
      - run: git diff --check

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --requirement requirements-slither.txt
      - run: python3 -I tools/test_check_slither_baseline.py
      - run: python3 -I tools/check_slither_baseline.py
